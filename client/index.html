<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realtime Canvas Board</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </div>
        <div class="brand-text">
          <h1>Realtime Canvas Board</h1>
        </div>
      </div>

      <div class="header-center">
        <button class="room-pill" id="room-info-btn" title="Switch Drawing Room / Room Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <span>Room:</span>
          <span class="room-name" id="current-room-display">default</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="settings-icon"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>

      <div class="header-right">
        <!-- Telemetry HUD -->
        <div class="telemetry-bar">
          <div class="metric" id="fps-metric" title="Frames Per Second">
            <span class="metric-label">FPS</span>
            <span class="metric-val" id="fps-val">60</span>
          </div>
          <div class="metric" id="ping-metric" title="Round Trip Latency">
            <span class="metric-label">PING</span>
            <span class="metric-val" id="ping-val">-- ms</span>
          </div>
        </div>

        <!-- Online Users Container -->
        <div class="users-container" id="users-list-container">
          <div class="users-counter" id="users-count-badge">1 Online</div>
          <div class="users-avatars" id="users-avatars-list">
            <!-- Avatars injected dynamically -->
          </div>
        </div>
      </div>
    </header>

    <!-- Main Canvas Workspace -->
    <main class="canvas-workspace" id="canvas-container">
      <!-- Layered Canvas System -->
      <canvas id="offscreen-canvas" class="canvas-layer"></canvas>
      <canvas id="preview-canvas" class="canvas-layer"></canvas>
      <canvas id="cursor-canvas" class="canvas-layer"></canvas>

      <!-- Fixed Top-Right Zoom Floating Widget -->
      <div class="pan-zoom-widget" id="pan-zoom-widget">
        <button class="widget-btn icon-only" id="btn-zoom-out" title="Zoom Out (-)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="zoom-display" id="btn-zoom-reset" title="Click to Reset Zoom (100%) & View">100%</button>
        <button class="widget-btn icon-only" id="btn-zoom-in" title="Zoom In (+)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="widget-btn icon-only" id="btn-reset-view" title="Recenter View (0,0)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 12h3m12 0h3M12 3v3m0 12v3"/></svg>
        </button>
      </div>

      <!-- Floating Toolbar -->
      <nav class="floating-toolbar">
        <!-- Drawing Tools -->
        <div class="toolbar-section tools-group">
          <button class="tool-btn active" data-tool="select" title="Pan / Select (V)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
            <span class="tool-tooltip">Pan / Cursor</span>
          </button>
          <button class="tool-btn" data-tool="brush" title="Brush (B)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
            <span class="tool-tooltip">Brush</span>
          </button>
          <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            <span class="tool-tooltip">Eraser</span>
          </button>
          <button class="tool-btn" data-tool="line" title="Line (L)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
            <span class="tool-tooltip">Line</span>
          </button>
          <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
            <span class="tool-tooltip">Rectangle</span>
          </button>
          <button class="tool-btn" data-tool="circle" title="Circle (C)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
            <span class="tool-tooltip">Circle</span>
          </button>
          <button class="tool-btn" data-tool="text" title="Text (T)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/></svg>
            <span class="tool-tooltip">Text</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Stroke Width Control -->
        <div class="toolbar-section size-group">
          <div class="size-preview-wrapper" title="Stroke Width Preview">
            <div class="size-preview-dot" id="stroke-preview-dot"></div>
          </div>
          <input type="range" id="stroke-width-slider" min="1" max="50" value="5" class="slider">
          <span class="size-label" id="stroke-width-val">5px</span>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Color Palette -->
        <div class="toolbar-section color-group">
          <div class="color-picker-wrapper">
            <input type="color" id="native-color-picker" value="#2563EB" title="Custom Color Picker">
          </div>
          <div class="palette-swatches">
            <button class="swatch active" data-color="#2563EB" style="background-color: #2563EB;"></button>
            <button class="swatch" data-color="#DC2626" style="background-color: #DC2626;"></button>
            <button class="swatch" data-color="#059669" style="background-color: #059669;"></button>
            <button class="swatch" data-color="#D97706" style="background-color: #D97706;"></button>
            <button class="swatch" data-color="#7C3AED" style="background-color: #7C3AED;"></button>
            <button class="swatch" data-color="#DB2777" style="background-color: #DB2777;"></button>
            <button class="swatch" data-color="#0F172A" style="background-color: #0F172A;"></button>
            <button class="swatch" data-color="#FFFFFF" style="background-color: #FFFFFF;"></button>
          </div>
        </div>

        <div class="toolbar-divider"></div>

        <!-- History Actions -->
        <div class="toolbar-section action-group">
          <button class="action-btn" id="btn-undo" title="Undo (Ctrl+Z)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            <span class="action-text">Undo</span>
          </button>
          <button class="action-btn" id="btn-redo" title="Redo (Ctrl+Y)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
            <span class="action-text">Redo</span>
          </button>
          <button class="action-btn danger" id="btn-clear" title="Clear Canvas">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            <span class="action-text">Clear</span>
          </button>
          <button class="action-btn success" id="btn-save" title="Export Image">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="action-text">Export</span>
          </button>
        </div>
      </nav>

      <!-- Notification Toast -->
      <div id="toast-container" class="toast-container"></div>
    </main>

    <!-- Room Switcher Modal -->
    <div class="modal-backdrop" id="room-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Join Studio Room</h2>
          <button class="modal-close" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="input-user-name">Your Display Name</label>
            <input type="text" id="input-user-name" placeholder="Enter display name" maxlength="20">
          </div>
          <div class="form-group">
            <label for="input-room-id">Room Name / ID</label>
            <input type="text" id="input-room-id" placeholder="e.g. design-sprint, room-1" value="default" maxlength="30">
          </div>
          <div class="room-quick-links">
            <span>Quick Join:</span>
            <button class="btn-chip" data-room="default">default</button>
            <button class="btn-chip" data-room="art-studio">art-studio</button>
            <button class="btn-chip" data-room="playground">playground</button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-primary" id="btn-join-room">Enter Room</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="websocket.js"></script>
  <script src="canvas.js"></script>
  <script src="main.js"></script>
</body>
</html>
